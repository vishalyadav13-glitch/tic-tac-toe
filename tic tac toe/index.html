<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic-tac-toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="msg-container hide">
        <div class="confetti-layer" aria-hidden="true"></div>
        <p id="msg">Winner</p>
        <button id="new-btn">New Game</button>
    </div>

    <section id="mode-screen" class="mode-screen">
        <h2>Play with</h2>
        <div class="mode-options">
            <button id="self-btn" class="mode-btn">Self</button>
            <button id="bot-btn" class="mode-btn">Bot</button>
        </div>

        <div id="difficulty-options" class="difficulty-options hide">
            <h3>Difficulty</h3>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-difficulty="beginner">Beginner</button>
                <button class="difficulty-btn" data-difficulty="intermediate">Intermediate</button>
                <button class="difficulty-btn" data-difficulty="pro">Pro</button>
            </div>
        </div>
    </section>

    <main id="game-screen" class="hide">
        <h1>tic-tac-toe</h1>
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <button id="reset-btn">RESET GAME</button>
    </main>

    <script src="apps.js"></script>
</body>
</html>
